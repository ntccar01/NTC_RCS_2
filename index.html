// ===== js/config/storage.js =====


const storage = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.warn('localStorage write failed:', e);
    }
  },

  getString(key, fallback = '') {
    return localStorage.getItem(key) || fallback;
  },

  setString(key, value) {
    localStorage.setItem(key, value);
  },
};

const loadCourses = () =>
  storage.get(STORAGE_KEYS.COURSES, [
    { id: 'default', name: '預設課程', students: [], records: {} },
  ]);

const saveCourses = (courses) => storage.set(STORAGE_KEYS.COURSES, courses);

const loadActiveCourseId = (courses) =>
  storage.getString(STORAGE_KEYS.ACTIVE_COURSE_ID, courses[0]?.id || '');

const saveActiveCourseId = (id) => storage.setString(STORAGE_KEYS.ACTIVE_COURSE_ID, id);

const loadPeriodConfig = () =>

// ===== js/models/course.js =====
const createCourse = (name) => ({
  id: 'c_' + Date.now() + Math.random(),
  name,
  students: [],
  records: {},
});

const deleteCourseFromList = (courses, courseId) => {
  if (courses.length <= 1) return courses;
  return courses.filter((c) => c.id !== courseId);
};

const updateCourse = (courses, courseId, updater) =>
  courses.map((c) => (c.id === courseId ? updater(c) : c));

const findCourse = (courses, courseId) =>
  courses.find((c) => c.id === courseId) || courses[0];


// ===== js/models/student.js =====
const parseStudentList = (text) => {
  return text
    .split(/\n/)
    .map((l) => l.trim())
    .filter((l) => l)
    .map((line) => {
      const m = line.match(/^(\d+)[.\s]+(.+)$/);
      return {
        id: Date.now() + Math.random(),
        number: m ? m[1] : '',
        name: m ? m[2] : line,
      };
    });
};

const sortStudents = (students) =>
  [...students].sort((a, b) => (parseInt(a.number) || 999) - (parseInt(b.number) || 999));

const removeStudent = (course, studentId) => ({
  ...course,
  students: course.students.filter((s) => s.id !== studentId),
});

const addStudents = (course, newStudents) => ({
  ...course,
  students: [...course.students, ...newStudents],
});


// ===== js/models/record.js =====
const getRecord = (course, date, period, studentId) => {
  const raw = course.records?.[date]?.[period]?.[studentId];
  if (typeof raw === 'object' && raw !== null) return raw.attendance || 'PRESENT';
  return raw || 'PRESENT';
};

const getRecordObj = (course, date, period, studentId) =>
  course.records?.[date]?.[period]?.[studentId] || null;

const setAttendance = (course, date, period, studentId, statusId) => {
  const dayRec = course.records[date] || {};
  const periodRec = dayRec[period] || {};
  const existing = periodRec[studentId];

  let updated;
  if (typeof existing === 'object' && existing !== null) {
    updated = { ...existing, attendance: statusId };
  } else {
    updated = { attendance: statusId };
  }

  return {
    ...course,
    records: {
      ...course.records,
      [date]: {
        ...dayRec,
        [period]: { ...periodRec, [studentId]: updated },
      },
    },
  };
};

const setRecordField = (course, date, period, studentId, field, value) => {
  const dayRec = course.records[date] || {};
  const periodRec = dayRec[period] || {};
  const existing = periodRec[studentId];

  let recordObj;
  if (typeof existing === 'object' && existing !== null) {
    recordObj = { ...existing };
  } else if (typeof existing === 'string') {
    recordObj = { attendance: existing };
  } else {
    recordObj = { attendance: 'PRESENT' };
  }

  recordObj[field] = value;

  return {
    ...course,
    records: {
      ...course.records,
      [date]: {
        ...dayRec,
        [period]: { ...periodRec, [studentId]: recordObj },
      },
    },
  };
};

const quickToggle = (course, date, period, studentId) => {
  const current = getRecord(course, date, period, studentId);
  const next = current === 'PRESENT' ? 'ABSENT' : 'PRESENT';
  return setAttendance(course, date, period, studentId, next);
};

const getPeriodStats = (students, records, date, period) => {
  const rec = records?.[date]?.[period] || {};
  let p = 0, a = 0, o = 0;
  students.forEach((s) => {
    const st = typeof rec[s.id] === 'object' ? rec[s.id]?.attendance : (rec[s.id] || 'PRESENT');
    if (st === 'PRESENT') p++;
    else if (st === 'ABSENT') a++;
    else o++;
  });
  return { p, a, o, t: students.length };
};

// --- 課堂紀錄：行為、作業、備註 ---

const getFullRecord = (course, date, period, studentId) => {
  const raw = course.records?.[date]?.[period]?.[studentId];
  if (!raw) return { attendance: 'PRESENT', behaviors: [], homework: 'NONE', note: '' };
  if (typeof raw === 'string') return { attendance: raw, behaviors: [], homework: 'NONE', note: '' };
  return {
    attendance: raw.attendance || 'PRESENT',
    behaviors: raw.behaviors || [],
    homework: raw.homework || 'NONE',
    note: raw.note || '',
  };
};

const ensureRecordObj = (existing) => {
  if (typeof existing === 'object' && existing !== null) return { ...existing };
  if (typeof existing === 'string') return { attendance: existing, behaviors: [], homework: 'NONE', note: '' };
  return { attendance: 'PRESENT', behaviors: [], homework: 'NONE', note: '' };
};

const toggleBehavior = (course, date, period, studentId, behaviorId) => {
  const dayRec = course.records[date] || {};
  const periodRec = dayRec[period] || {};
  const recordObj = ensureRecordObj(periodRec[studentId]);

  const behaviors = recordObj.behaviors || [];
  recordObj.behaviors = behaviors.includes(behaviorId)
    ? behaviors.filter((b) => b !== behaviorId)
    : [...behaviors, behaviorId];

  return {
    ...course,
    records: {
      ...course.records,
      [date]: {
        ...dayRec,
        [period]: { ...periodRec, [studentId]: recordObj },
      },
    },
  };
};

const setHomeworkStatus = (course, date, period, studentId, status) => {
  const dayRec = course.records[date] || {};
  const periodRec = dayRec[period] || {};
  const recordObj = ensureRecordObj(periodRec[studentId]);
  recordObj.homework = status;

  return {
    ...course,
    records: {
      ...course.records,
      [date]: {
        ...dayRec,
        [period]: { ...periodRec, [studentId]: recordObj },
      },
    },
  };
};

const setStudentNote = (course, date, period, studentId, note) => {
  const dayRec = course.records[date] || {};
  const periodRec = dayRec[period] || {};
  const recordObj = ensureRecordObj(periodRec[studentId]);
  recordObj.note = note;

  return {
    ...course,
    records: {
      ...course.records,
      [date]: {
        ...dayRec,
        [period]: { ...periodRec, [studentId]: recordObj },
      },
    },
  };
};

const calcBehaviorScore = (behaviors, behaviorConfig) => {
  return behaviors.reduce((sum, bId) => {
    const cfg = behaviorConfig.find((c) => c.id === bId);
    if (!cfg) return sum;
    return sum + (cfg.penalty || 0) + (cfg.bonus || 0);
  }, 0);
};

const getCourseBehaviorSummary = (course, date, students, behaviorConfig) => {
  const periodRec = course.records?.[date] || {};
  const summary = {};
  students.forEach((s) => {
    let totalScore = 0;
    const allBehaviors = [];
    Object.values(periodRec).forEach((periodData) => {
      const raw = periodData?.[s.id];
      if (!raw || typeof raw === 'string') return;
      (raw.behaviors || []).forEach((bId) => {
        allBehaviors.push(bId);
        const cfg = behaviorConfig.find((c) => c.id === bId);
        if (cfg) totalScore += (cfg.penalty || 0) + (cfg.bonus || 0);
      });
    });
    summary[s.id] = { score: totalScore, behaviors: allBehaviors };
  });
  return summary;
};

// --- Phase 2: 統計彙整 ---

const getStudentFullStats = (course, studentId, behaviorConfig) => {
  const records = course.records || {};
  let totalScore = 0;
  const behaviorCounts = {};
  let present = 0, absent = 0, late = 0, leaveEarly = 0, sick = 0, personal = 0, official = 0;
  let homeworkDone = 0, homeworkTotal = 0;
  let totalPeriods = 0;

  Object.values(records).forEach((dayRec) => {
    Object.values(dayRec).forEach((periodRec) => {
      const raw = periodRec?.[studentId];
      if (!raw) return;
      totalPeriods++;

      const att = typeof raw === 'string' ? raw : (raw.attendance || 'PRESENT');
      if (att === 'PRESENT') present++;
      else if (att === 'ABSENT') absent++;
      else if (att === 'LATE') late++;
      else if (att === 'LEAVE_EARLY') leaveEarly++;
      else if (att === 'SICK') sick++;
      else if (att === 'PERSONAL') personal++;
      else if (att === 'OFFICIAL') official++;

      const hw = typeof raw === 'object' ? raw.homework : null;
      if (hw && hw !== 'NONE') {
        homeworkTotal++;
        if (hw === 'DONE') homeworkDone++;
      }

      const behaviors = typeof raw === 'object' ? (raw.behaviors || []) : [];
      behaviors.forEach((bId) => {
        behaviorCounts[bId] = (behaviorCounts[bId] || 0) + 1;
        const cfg = behaviorConfig.find((c) => c.id === bId);
        if (cfg) totalScore += (cfg.penalty || 0) + (cfg.bonus || 0);
      });
    });
  });

  const attendanceRate = totalPeriods > 0 ? Math.round((present / totalPeriods) * 100) : 100;
  const homeworkRate = homeworkTotal > 0 ? Math.round((homeworkDone / homeworkTotal) * 100) : 100;

  return {
    score: totalScore,
    attendance: { present, absent, late, leaveEarly, sick, personal, official, total: totalPeriods, rate: attendanceRate },
    homework: { done: homeworkDone, total: homeworkTotal, rate: homeworkRate },
    behaviorCounts,
  };
};

const getDailyTrend = (course, students, periodConfig) => {
  const dates = Object.keys(course.records).sort();
  return dates.map((date) => {
    let p = 0, a = 0, o = 0;
    const dayRec = course.records[date] || {};
    students.forEach((s) => {
      let hasRecord = false;
      periodConfig.forEach((period) => {
        const raw = dayRec[period]?.[s.id];
        if (!raw) return;
        hasRecord = true;
        const att = typeof raw === 'string' ? raw : (raw.attendance || 'PRESENT');
        if (att === 'PRESENT') p++;
        else if (att === 'ABSENT') a++;
        else o++;
      });
      if (!hasRecord) p++;
    });
    const total = students.length * periodConfig.length || 1;
    return {
      date,
      present: p,
      absent: a,
      other: o,
      rate: Math.round((p / total) * 100),
    };
  });
};

const getBehaviorDistribution = (course, students, behaviorConfig) => {
  const dist = {};
  behaviorConfig.forEach((b) => { dist[b.id] = 0; });

  Object.values(course.records).forEach((dayRec) => {
    Object.values(dayRec).forEach((periodRec) => {
      students.forEach((s) => {
        const raw = periodRec?.[s.id];
        if (!raw || typeof raw === 'string') return;
        (raw.behaviors || []).forEach((bId) => {
          if (dist[bId] !== undefined) dist[bId]++;
        });
      });
    });
  });

  return behaviorConfig
    .map((b) => ({ ...b, count: dist[b.id] || 0 }))
    .sort((a, b) => b.count - a.count);
};

const getHomeworkStats = (course, students) => {
  const stats = { DONE: 0, NOT_DONE: 0, LATE: 0, NONE: 0 };
  Object.values(course.records).forEach((dayRec) => {
    Object.values(dayRec).forEach((periodRec) => {
      students.forEach((s) => {
        const raw = periodRec?.[s.id];
        if (!raw || typeof raw === 'string') return;
        const hw = raw.homework || 'NONE';
        stats[hw] = (stats[hw] || 0) + 1;
      });
    });
  });
  return stats;
};


// ===== js/utils/anonymize.js =====
const anonymizeName = (name) => {
  if (!name) return '';
  if (name.length === 2) return 'O' + name.slice(1);
  if (name.length === 3) return name[0] + 'O' + name.slice(2);
  if (name.length === 4) return name.slice(0, 2) + 'O' + name.slice(3);
  return name.length > 4 ? name.slice(0, -2) + 'O' + name.slice(-1) : name;
};


// ===== js/utils/report.js =====





const generateReport = (course, date, period) => {
  const sorted = sortStudents(course.students);
  const groups = { ABSENT: [], LATE: [], LEAVE_EARLY: [], SICK: [], PERSONAL: [], OFFICIAL: [] };
  let presentCount = 0;

  sorted.forEach((s) => {
    const st = getRecord(course, date, period, s.id);
    if (st === 'PRESENT') {
      presentCount++;
    } else if (groups[st]) {
      const num = s.number ? s.number + '.' : '';
      groups[st].push(`${num}${anonymizeName(s.name)}`);
    }
  });

  let report = `🏫 ${course.name}\n📅 ${date} (${period})\n📊 應到 ${sorted.length} / 實到 ${presentCount}\n------------------\n`;

  const labels = {
    ABSENT: '❌ 缺席',
    LATE: '⚠️ 遲到',
    LEAVE_EARLY: '🏃 早退',
    SICK: '😷 病假',
    PERSONAL: '🏠 事假',
    OFFICIAL: '🏢 公假',
  };

  for (const [key, list] of Object.entries(groups)) {
    if (list.length > 0) {
      report += `${labels[key]}：${list.join('、')}\n`;
    }
  }

  if (Object.values(groups).every((arr) => arr.length === 0)) {
    report += '✅ 全員到齊\n';
  }

  return report;
};

const copyToClipboard = (text) => {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    return true;
  } catch {
    return false;
  } finally {
    document.body.removeChild(ta);
  }
};


// ===== js/services/cloudSync.js =====




const backupReport = async (scriptUrl, course, date, period) => {
  const sorted = sortStudents(course.students);
  const records = course.records?.[date]?.[period] || {};

  const payload = {
    type: 'backup_report',
    course: course.name,
    date,
    period,
    students: sorted.map((s) => ({
      number: s.number,
      name: s.name,
      statusLabel: STATUS_CONFIG[getRecord(course, date, period, s.id)].label,
    })),
  };

  const res = await fetch(scriptUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  return res;
};

const syncUpload = async (scriptUrl, courses, periodConfig) => {
  const payload = { type: 'sync_upload', payload: { courses, periodConfig } };
  const res = await fetch(scriptUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  return res;
};

const syncDownload = async (scriptUrl) => {

};


// ===== js/hooks/useNotification.js =====


function useNotification() {
  const [notification, setNotification] = useState('');

  const showToast = useCallback((msg) => {
    setNotification(msg);
    setTimeout(() => setNotification(''), 3000);
  }, []);

  return { notification, showToast };
}


// ===== js/hooks/useCourses.js =====







function useCourses() {
  const [courses, setCourses] = useState(() => loadCourses());
  const [activeCourseId, setActiveCourseId] = useState(() => loadActiveCourseId(courses));
  const [periodConfig, setPeriodConfig] = useState(() => loadPeriodConfig() || DEFAULT_PERIODS);
  const [scriptUrl, setScriptUrl] = useState(() => loadScriptUrl());
  const [customBehaviors, setCustomBehaviors] = useState(() => loadCustomBehaviors());
  const [hiddenDefaults, setHiddenDefaults] = useState(() => loadHiddenDefaults());

  const activeCourseIdRef = useRef(activeCourseId);
  activeCourseIdRef.current = activeCourseId;

  const activeCourse = findCourse(courses, activeCourseId);

  useEffect(() => saveCourses(courses), [courses]);
  useEffect(() => saveActiveCourseId(activeCourseId), [activeCourseId]);
  useEffect(() => savePeriodConfig(periodConfig), [periodConfig]);
  useEffect(() => saveScriptUrl(scriptUrl), [scriptUrl]);
  useEffect(() => saveCustomBehaviors(customBehaviors), [customBehaviors]);
  useEffect(() => saveHiddenDefaults(hiddenDefaults), [hiddenDefaults]);

  // Merge: defaults (minus hidden) → apply custom overrides (edited defaults replace originals)
  const behaviors = (() => {
    const visible = DEFAULT_BEHAVIORS.filter((d) => !hiddenDefaults.includes(d.id));
    const overrides = customBehaviors.filter((c) => c.edited);
    const overriddenIds = overrides.map((o) => o.id);
    const base = visible.filter((d) => !overriddenIds.includes(d.id));
    const customNew = customBehaviors.filter((c) => !c.edited);
    return [...base, ...overrides, ...customNew];
  })();

  const addCustomBehavior = (behavior) => {
    if (behaviors.some((b) => b.label === behavior.label && b.id !== behavior.id)) return false;
    setCustomBehaviors((prev) => [...prev, behavior]);
    return true;
  };

  const deleteCustomBehavior = (behaviorId) => {
    const custom = customBehaviors.find((c) => c.id === behaviorId);
    if (custom && custom.edited) {
      // Deleting an edited default → remove the override, behavior reverts to original
      setCustomBehaviors((prev) => prev.filter((b) => b.id !== behaviorId));
    } else {
      // Deleting a pure custom behavior
      setCustomBehaviors((prev) => prev.filter((b) => b.id !== behaviorId));
    }
  };

  const hideDefaultBehavior = (behaviorId) => {
    setHiddenDefaults((prev) => [...prev, behaviorId]);
    // Also remove any override if it exists
    setCustomBehaviors((prev) => prev.filter((b) => b.id !== behaviorId));
  };

  const showDefaultBehavior = (behaviorId) => {
    setHiddenDefaults((prev) => prev.filter((id) => id !== behaviorId));
  };

  const updateCustomBehavior = (behaviorId, updates) => {
    setCustomBehaviors((prev) => prev.map((b) => b.id === behaviorId ? { ...b, ...updates } : b));
  };

  const updateActiveCourse = (updater) => {
    const cid = activeCourseIdRef.current;
    setCourses((prev) => prev.map((c) => (c.id === cid ? updater(c) : c)));
  };

  const addNewCourse = (names) => {
    const newCourses = names.map((n) => createCourse(n));
    setCourses((prev) => [...prev, ...newCourses]);
    setActiveCourseId(newCourses[0].id);
  };

  const deleteCourse = (courseId) => {
    if (courses.length <= 1) return;
    const filtered = deleteCourseFromList(courses, courseId);
    setCourses(filtered);
    if (activeCourseId === courseId) {
      setActiveCourseId(filtered[0].id);
    }
  };

  const importStudents = (text) => {
    const newStudents = parseStudentList(text);
    updateActiveCourse((c) => addStudents(c, newStudents));
  };

  const deleteStudent = (studentId) => {
    updateActiveCourse((c) => removeStudent(c, studentId));
  };

  const setStudentStatus = (studentId, statusId, date, period) => {
    updateActiveCourse((c) => setAttendance(c, date, period, studentId, statusId));
  };

  const quickToggleStudent = (studentId, date, period) => {
    updateActiveCourse((c) => quickToggle(c, date, period, studentId));
  };

  const toggleStudentBehavior = (studentId, date, period, behaviorId) => {
    updateActiveCourse((c) => toggleBehavior(c, date, period, studentId, behaviorId));
  };

  const setStudentHomework = (studentId, date, period, status) => {
    updateActiveCourse((c) => setHomeworkStatus(c, date, period, studentId, status));
  };

  const setStudentNoteText = (studentId, date, period, note) => {
    updateActiveCourse((c) => setStudentNote(c, date, period, studentId, note));
  };

  return {
    courses,
    setCourses,
    activeCourse,
    activeCourseId,
    setActiveCourseId,
    periodConfig,
    setPeriodConfig,
    scriptUrl,
    setScriptUrl,
    behaviors,
    customBehaviors,
    hiddenDefaults,
    addCustomBehavior,
    updateCustomBehavior,
    deleteCustomBehavior,
    hideDefaultBehavior,
    showDefaultBehavior,
    addNewCourse,
    deleteCourse,
    importStudents,
    deleteStudent,
    setStudentStatus,
    quickToggleStudent,
    toggleStudentBehavior,
    setStudentHomework,
    setStudentNoteText,
    updateActiveCourse,
  };
}

function Sidebar({
  courses, activeCourseId, setActiveCourseId,
  periodConfig, scriptUrl, setScriptUrl, setPeriodConfig,
  addNewCourse, deleteCourse,
  setModalType, setInputText, setIsSidebarOpen,
  setCourses, showToast,
  onOpenScoreBoard, onOpenStatsPanel,
}) {
  const [isSyncing, setIsSyncing] = useState(false);

  const handleCloudSyncUpload = async () => {
    if (!scriptUrl) { setModalType('CLOUD_SETUP'); return; }
    if (!window.confirm('⚠️ 確定要將「目前所有的課程、學生、紀錄」上傳覆蓋雲端存檔嗎？')) return;
    setIsSyncing(true);
    try {
      await syncUpload(scriptUrl, courses, periodConfig);
      showToast('⬆️ 設定已上傳至雲端！');
    } catch (e) { showToast('❌ 上傳失敗'); }
    finally { setIsSyncing(false); }
  };

  const handleCloudSyncDownload = async () => {
    if (!scriptUrl) { setModalType('CLOUD_SETUP'); return; }
    if (!window.confirm('⚠️ 警告：確定要從雲端還原資料嗎？\n(這將會「清除並覆蓋」您目前手機上的所有資料！)')) return;
    setIsSyncing(true);
    try {
      const data = await syncDownload(scriptUrl);
      if (data.result === 'empty') {
        showToast('☁️ 雲端尚無備份資料');
      } else if (data.courses) {
        setCourses(data.courses);
        if (data.periodConfig) setPeriodConfig(data.periodConfig);
        if (!data.courses.find((c) => c.id === activeCourseId)) {
          setActiveCourseId(data.courses[0].id);
        }
        showToast('⬇️ 資料還原成功！');
        setIsSidebarOpen(false);
      } else {
        showToast('❌ 雲端資料格式錯誤');
      }
    } catch (e) {
      showToast('❌ 下載失敗 (請檢查網址或權限)');
    } finally { setIsSyncing(false); }
  };

  const handleDelete = (e, id) => {
    e.stopPropagation();
    if (courses.length <= 1) return;
    if (confirm('刪除課程？')) deleteCourse(id);
  };

  const openSettings = (type, defaultText) => {
    setInputText(defaultText);
    setModalType(type);
    setIsSidebarOpen(false);
  };

  return (
    <React.Fragment>
      <div className="p-4 bg-slate-100 border-b flex justify-between items-center">
        <h2 className="font-bold text-slate-700 flex items-center gap-2"><Icons.BookOpen size={18}/> 課程</h2>
        <button onClick={() => setModalType('COURSE')} className="p-1.5 bg-indigo-100 text-indigo-600 rounded"><Icons.Plus size={18}/></button>
      </div>
      <div className="flex-1 overflow-y-auto p-2 space-y-1">
        {courses.map((c) => (
          <div key={c.id} onClick={() => { setActiveCourseId(c.id); setIsSidebarOpen(false); }}
            className={`group flex items-center justify-between p-3 rounded-lg cursor-pointer ${activeCourseId === c.id ? 'bg-indigo-50 text-indigo-700 font-bold' : 'hover:bg-gray-100 text-gray-600'}`}>
            <span className="truncate">{c.name}</span>
            <div className="flex items-center gap-2">
              {activeCourseId === c.id && <Icons.Check size={16}/>}
              <button onClick={(e) => handleDelete(e, c.id)} className="p-1 text-gray-400 hover:text-red-500 transition-colors"><Icons.Trash2 size={14}/></button>
            </div>
          </div>
        ))}
      </div>
      <div className="p-4 border-t space-y-2 bg-gray-50">
        <div className="text-xs font-bold text-gray-400 uppercase mb-1">雲端同步 (換裝置用)</div>
        <button disabled={isSyncing} onClick={handleCloudSyncUpload}
          className="flex items-center w-full gap-3 p-3 text-sm font-medium text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100">
          {isSyncing ? <span className="spinner"></span> : <Icons.Save size={16}/>} 上傳設定 (備份到雲端)
        </button>
        <button disabled={isSyncing} onClick={handleCloudSyncDownload}
          className="flex items-center w-full gap-3 p-3 text-sm font-medium text-orange-700 bg-orange-50 border border-orange-200 rounded-lg hover:bg-orange-100">
          {isSyncing ? <span className="spinner"></span> : <Icons.Download size={16}/>} 下載設定 (從雲端還原)
        </button>
        <hr className="my-2"/>
        <button onClick={() => openSettings('CLOUD_SETUP', scriptUrl)}
          className={`flex items-center w-full gap-3 p-3 text-sm font-medium border rounded-lg ${scriptUrl ? 'text-green-700 bg-green-50' : 'text-gray-700 bg-white'}`}>
          <Icons.Settings size={16}/>{scriptUrl ? '已連結 Google' : '設定雲端連結'}
        </button>
        <button onClick={() => openSettings('PERIOD', periodConfig.join('\n'))}
          className="flex items-center w-full gap-3 p-3 text-sm font-medium text-gray-700 bg-white border rounded-lg">
          <Icons.List size={16}/> 設定節次
        </button>
        <button onClick={() => { setModalType('IMPORT'); setIsSidebarOpen(false); }}
          className="flex items-center w-full gap-3 p-3 text-sm font-medium text-gray-700 bg-white border rounded-lg">
          <Icons.Upload size={16}/> 匯入名單
        </button>
        <hr className="my-2"/>
        <div className="text-xs font-bold text-gray-400 uppercase mb-1">成績統計</div>
        <button onClick={() => { onOpenScoreBoard(); setIsSidebarOpen(false); }}
          className="flex items-center w-full gap-3 p-3 text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-lg hover:bg-indigo-100">
          <Icons.ShieldCheck size={16}/> 績效排行榜
        </button>
        <button onClick={() => { onOpenStatsPanel(); setIsSidebarOpen(false); }}
          className="flex items-center w-full gap-3 p-3 text-sm font-medium text-purple-700 bg-purple-50 border border-purple-200 rounded-lg hover:bg-purple-100">
          <Icons.Monitor size={16}/> 課堂統計圖表
        </button>
        <button onClick={() => setIsSidebarOpen(false)} className="md:hidden w-full py-2 text-center text-gray-500 bg-gray-200 rounded mt-2">關閉</button>
      </div>
    </React.Fragment>
  );
}

// ===== js/components/BehaviorManager.jsx =====



const EMOJI_LIST = ['📱','😴','🗣️','😵','💬','🍔','🚶','🙋','🤝','💡','📚','✏️','🎒','🖊️','😠','🫥','🎧','📖','💤','🎮'];

const COLOR_LIST = [
  'bg-red-50 text-red-600 border-red-200',
  'bg-orange-50 text-orange-600 border-orange-200',
  'bg-yellow-50 text-yellow-600 border-yellow-200',
  'bg-amber-50 text-amber-600 border-amber-200',
  'bg-green-50 text-green-600 border-green-200',
  'bg-blue-50 text-blue-600 border-blue-200',
  'bg-indigo-50 text-indigo-600 border-indigo-200',
  'bg-purple-50 text-purple-600 border-purple-200',
  'bg-pink-50 text-pink-600 border-pink-200',
  'bg-cyan-50 text-cyan-600 border-cyan-200',
];

function BehaviorManager({ behaviors, customBehaviors, addCustomBehavior, updateCustomBehavior, deleteCustomBehavior, hideDefaultBehavior, onClose }) {
  const [label, setLabel] = useState('');
  const [icon, setIcon] = useState('📱');
  const [score, setScore] = useState(0);
  const [isBonus, setIsBonus] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const resetForm = () => {
    setLabel(''); setIcon('📱'); setScore(0); setIsBonus(false); setEditingId(null);
  };

  const startEdit = (b) => {
    setEditingId(b.id);
    setLabel(b.label);
    setIcon(b.icon);
    setIsBonus(b.bonus > 0);
    setScore(b.bonus > 0 ? b.bonus : Math.abs(b.penalty));
  };

  const handleSave = () => {
    const trimmed = label.trim();
    if (!trimmed) return;
    const penalty = isBonus ? 0 : -Math.abs(score);
    const bonus = isBonus ? Math.abs(score) : 0;
    const existingCustom = customBehaviors.find((c) => c.id === editingId);
    if (existingCustom) {
      // Updating a custom or already-edited default
      updateCustomBehavior(editingId, { label: trimmed, icon: icon || '⭐', penalty, bonus });
    } else {
      // Editing a default → create custom override with edited flag
      const defaultB = behaviors.find((b) => b.id === editingId);
      const override = {
        id: editingId,
        label: trimmed,
        icon: icon || '⭐',
        penalty,
        bonus,
        color: defaultB?.color || COLOR_LIST[0],
        edited: true,
      };
      addCustomBehavior(override);
    }
    resetForm();
  };

  const handleAdd = () => {
    const trimmed = label.trim();
    if (!trimmed) return;
    const penalty = isBonus ? 0 : -Math.abs(score);
    const bonus = isBonus ? Math.abs(score) : 0;
    const newBehavior = {
      id: 'b_' + Date.now() + Math.random(),
      label: trimmed,
      icon: icon || '⭐',
      penalty,
      bonus,
      color: COLOR_LIST[Math.floor(Math.random() * COLOR_LIST.length)],
    };
    if (addCustomBehavior(newBehavior)) {
      setLabel(''); setScore(0);
    }
  };

  const handleDelete = (b) => {
    const isDefault = !b.edited && !customBehaviors.some((c) => c.id === b.id);
    if (isDefault) {
      hideDefaultBehavior(b.id);
    } else {
      deleteCustomBehavior(b.id);
    }
    if (editingId === b.id) resetForm();
  };

  const isEditing = editingId !== null;

  return (
    <div className="fixed inset-0 z-[65] flex items-end md:items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white w-full max-w-md rounded-t-2xl md:rounded-2xl shadow-2xl m-0 md:m-4 max-h-[90vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
        {/* Header */}
        <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
          <h3 className="font-bold text-lg flex items-center gap-2">
            {isEditing ? <><Icons.Edit3 size={18}/> 修改行為</> : <><Icons.Plus size={18}/> 管理行為項目</>}
          </h3>
          <button onClick={onClose} className="p-1 hover:bg-gray-200 rounded-full"><Icons.X size={20}/></button>
        </div>

        <div className="flex-1 overflow-y-auto p-4 space-y-5">
          {/* Add / Edit form */}
          <div className="bg-gray-50 rounded-xl p-4 space-y-3">
            <h4 className="text-sm font-bold text-gray-600 mb-1">{isEditing ? '修改行為' : '新增行為'}</h4>
            <input
              type="text"
              value={label}
              onChange={(e) => setLabel(e.target.value)}
              placeholder="行為名稱（例：塗鴉、代班代答）"
              className="w-full p-2.5 bg-white border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            />
            <div className="flex flex-wrap gap-1.5">
              {EMOJI_LIST.map((em) => (
                <button key={em} onClick={() => setIcon(em)}
                  className={`w-8 h-8 text-lg rounded flex items-center justify-center ${icon === em ? 'bg-indigo-100 ring-2 ring-indigo-300' : 'bg-gray-100 hover:bg-gray-200'}`}>
                  {em}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-3">
              <select value={isBonus ? 'bonus' : (score < 0 ? 'minus' : 'zero')}
                onChange={(e) => { setIsBonus(e.target.value === 'bonus'); setScore(0); }}
                className="p-2 border rounded-lg text-sm bg-white">
                <option value="minus">扣分</option>
                <option value="bonus">加分</option>
                <option value="zero">不分</option>
              </select>
              <input type="number" min="1" max="20" value={Math.abs(score)}
                onChange={(e) => setScore(parseInt(e.target.value) || 0)}
                className="w-20 p-2 border rounded-lg text-sm text-center bg-white"
              />
              <span className="text-sm text-gray-500">分</span>
            </div>
            <div className="flex gap-2">
              {isEditing && (
                <button onClick={resetForm}
                  className="flex-1 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300">
                  取消
                </button>
              )}
              <button onClick={isEditing ? handleSave : handleAdd}
                className="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700">
                {isEditing ? '儲存修改' : '＋ 新增行為'}
              </button>
            </div>
          </div>

          {/* All behaviors list */}
          <div>
            <h4 className="text-sm font-bold text-gray-600 mb-2">所有行為（{behaviors.length}）</h4>
            <div className="space-y-2">
              {behaviors.map((b) => {
                const isCustom = customBehaviors.some((c) => c.id === b.id);
                const isEdited = b.edited;
                return (
                  <div key={b.id} className={`flex items-center justify-between p-2.5 bg-white rounded-lg border ${editingId === b.id ? 'ring-2 ring-indigo-300' : ''}`}>
                    <div className="flex items-center gap-2">
                      <span className="text-lg">{b.icon}</span>
                      <span className="font-bold text-sm">{b.label}</span>
                      <span className={`text-xs font-bold px-1.5 py-0.5 rounded ${b.bonus > 0 ? 'bg-green-100 text-green-600' : b.penalty < 0 ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-500'}`}>
                        {b.bonus > 0 ? '+' + b.bonus : (b.penalty < 0 ? b.penalty : '0')}
                      </span>
                      {isEdited && <span className="text-xs bg-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded">已修改</span>}
                      {isCustom && !isEdited && <span className="text-xs bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded">自訂</span>}
                    </div>
                    <div className="flex items-center gap-1">
                      <button onClick={() => startEdit(b)}
                        className="p-1.5 text-gray-400 hover:text-indigo-500 rounded-lg"><Icons.Edit3 size={16}/></button>
                      <button onClick={() => handleDelete(b)}
                        className="p-1.5 text-gray-400 hover:text-red-500 rounded-lg"><Icons.Trash2 size={16}/></button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="p-4 border-t bg-gray-50 rounded-b-2xl">
          <button onClick={onClose} className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700">完成</button>
        </div>
      </div>
    </div>
  );
}

function ScoreBoard({ behaviors, course, onClose }) {
  const [sortBy, setSortBy] = useState('score');
  const [sortDir, setSortDir] = useState('asc');
  const [expandedId, setExpandedId] = useState(null);

  const students = useMemo(() => sortStudents(course.students), [course.students]);

  const statsMap = useMemo(() => {
    const map = {};
    students.forEach((s) => {
      map[s.id] = getStudentFullStats(course, s.id, behaviors);
    });
    return map;
  }, [course, students]);

  const sorted = useMemo(() => {
    const arr = [...students];
    arr.sort((a, b) => {
      const sa = statsMap[a.id];
      const sb = statsMap[b.id];
      let va, vb;
      if (sortBy === 'score') { va = sa.score; vb = sb.score; }
      else if (sortBy === 'attendance') { va = sa.attendance.rate; vb = sb.attendance.rate; }
      else if (sortBy === 'homework') { va = sa.homework.rate; vb = sb.homework.rate; }
      else { va = sa.behaviorCounts ? Object.values(sa.behaviorCounts).reduce((s, v) => s + v, 0) : 0;
             vb = sb.behaviorCounts ? Object.values(sb.behaviorCounts).reduce((s, v) => s + v, 0) : 0; }
      return sortDir === 'asc' ? va - vb : vb - va;
    });
    return arr;
  }, [students, statsMap, sortBy, sortDir]);

  const toggleSort = (field) => {
    if (sortBy === field) setSortDir((d) => d === 'asc' ? 'desc' : 'asc');
    else { setSortBy(field); setSortDir('asc'); }
  };

  const getRateLabel = (rate) => {
    const t = ATTENDANCE_RATE_THRESHOLDS.find((t) => rate >= t.min);
    return t || ATTENDANCE_RATE_THRESHOLDS[ATTENDANCE_RATE_THRESHOLDS.length - 1];
  };

  const SortHeader = ({ field, label }) => (
    <button onClick={() => toggleSort(field)}
      className={`text-xs font-bold cursor-pointer hover:text-indigo-600 flex items-center gap-0.5 ${sortBy === field ? 'text-indigo-600' : 'text-gray-400'}`}>
      {label}
      {sortBy === field && <span>{sortDir === 'asc' ? '↑' : '↓'}</span>}
    </button>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white w-full max-w-2xl rounded-t-2xl md:rounded-2xl shadow-2xl m-0 md:m-4 max-h-[90vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
        {/* Header */}
        <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
          <h3 className="font-bold text-lg flex items-center gap-2">
            <Icons.ShieldCheck size={20} className="text-indigo-500"/> 績效排行榜
          </h3>
          <button onClick={onClose} className="p-1 hover:bg-gray-200 rounded-full"><Icons.X size={20}/></button>
        </div>

        {/* Table Header */}
        <div className="px-4 py-2 border-b bg-gray-50 grid grid-cols-[2.5rem_1fr_4rem_4rem_4rem_4rem] gap-2 items-center">
          <span className="text-xs text-gray-400">#</span>
          <span className="text-xs text-gray-400">姓名</span>
          <SortHeader field="score" label="績效分"/>
          <SortHeader field="attendance" label="出勤率"/>
          <SortHeader field="homework" label="作業率"/>
          <SortHeader field="behaviors" label="行為數"/>
        </div>

        {/* List */}
        <div className="flex-1 overflow-y-auto">
          {sorted.map((s, i) => {
            const st = statsMap[s.id];
            const rateInfo = getRateLabel(st.attendance.rate);
            const isExpanded = expandedId === s.id;
            const behaviorCount = Object.values(st.behaviorCounts).reduce((sum, v) => sum + v, 0);

            return (
              <div key={s.id} className="border-b border-gray-100">
                <div className="px-4 py-3 grid grid-cols-[2.5rem_1fr_4rem_4rem_4rem_4rem] gap-2 items-center hover:bg-gray-50 cursor-pointer"
                  onClick={() => setExpandedId(isExpanded ? null : s.id)}>
                  <span className="text-sm text-gray-400 font-mono">{i + 1}</span>
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="font-mono text-xs text-gray-400">{s.number || ''}</span>
                    <span className="font-bold text-sm truncate">{s.name}</span>
                  </div>
                  <span className={`text-sm font-bold ${st.score > 0 ? 'text-green-600' : st.score < 0 ? 'text-red-600' : 'text-gray-500'}`}>

                        <span className="font-bold text-orange-600">{st.attendance.leaveEarly}</span>

        {/* Footer */}
        <div className="p-4 border-t bg-gray-50 rounded-b-2xl">

function BarChart({ data, maxVal, colorFn, labelKey, valueKey, height = 120 }) {
  const max = maxVal || Math.max(...data.map((d) => d[valueKey]), 1);
  return (
    <div className="flex items-end gap-1" style={{ height }}>
      {data.map((d, i) => {
        const h = Math.max((d[valueKey] / max) * (height - 20), 2);
        return (
          <div key={i} className="flex-1 flex flex-col items-center gap-1">
            <span className="text-[10px] font-bold text-gray-500">{d[valueKey]}</span>
            <div className="w-full rounded-t" style={{ height: h, backgroundColor: colorFn(d, i) }}></div>
            <span className="text-[9px] text-gray-400 truncate w-full text-center">{d[labelKey]}</span>
          </div>
        );
      })}
    </div>
  );
}

function DonutChart({ segments, size = 100 }) {
  const total = segments.reduce((s, seg) => s + seg.value, 0) || 1;
  let cumulative = 0;
  const gradientParts = segments.map((seg) => {
    const start = (cumulative / total) * 360;
    cumulative += seg.value;
    const end = (cumulative / total) * 360;
    return `${seg.color} ${start}deg ${end}deg`;
  });
  const gradient = `conic-gradient(${gradientParts.join(', ')})`;

  return (
    <div className="relative" style={{ width: size, height: size }}>
      <div className="w-full h-full rounded-full" style={{ background: gradient }}></div>
      <div className="absolute inset-0 flex items-center justify-center">
        <div className="bg-white rounded-full" style={{ width: size * 0.55, height: size * 0.55 }}></div>
      </div>
      <div className="absolute inset-0 flex items-center justify-center">
        <span className="text-sm font-bold text-gray-700">{total}</span>
      </div>
    </div>
  );
}

function TrendChart({ data, height = 100 }) {
  if (data.length === 0) return <div className="text-gray-400 text-sm">尚無資料</div>;
  const maxRate = 100;
  const points = data.map((d, i) => {
    const x = (i / (data.length - 1 || 1)) * 100;
    const y = 100 - (d.rate / maxRate) * 100;
    return `${x},${y}`;
  }).join(' ');
  const areaPoints = `0,100 ${points} 100,100`;

  return (
    <div>
      <svg viewBox="0 0 100 100" className="w-full" style={{ height }} preserveAspectRatio="none">
        <polygon points={areaPoints} fill="rgba(99,102,241,0.1)"/>
        <polyline points={points} fill="none" stroke="#6366f1" strokeWidth="2" vectorEffect="non-scaling-stroke"/>
      </svg>
      <div className="flex justify-between text-[9px] text-gray-400 mt-1">
        <span>{data[0]?.date?.slice(5) || ''}</span>
        <span>{data[data.length - 1]?.date?.slice(5) || ''}</span>
      </div>
    </div>
  );
}

// ===== js/app.js =====



















function App() {
  const {
    courses, setCourses,
    activeCourse, activeCourseId, setActiveCourseId,
    periodConfig, setPeriodConfig,
    scriptUrl, setScriptUrl,
    behaviors, customBehaviors, addCustomBehavior, updateCustomBehavior, deleteCustomBehavior, hideDefaultBehavior, showDefaultBehavior,
    addNewCourse, deleteCourse,
    importStudents, deleteStudent,
    setStudentStatus, quickToggleStudent,
    toggleStudentBehavior, setStudentHomework, setStudentNoteText,
    updateActiveCourse,
  } = useCourses();

  const { notification, showToast } = useNotification();

  const [currentDate, setCurrentDate] = useState(() => new Date().toISOString().split('T')[0]);
  const [currentPeriod, setCurrentPeriod] = useState(() => (DEFAULT_PERIODS[1] || DEFAULT_PERIODS[0]));
  const [isSidebarOpen, setIsSidebarOpen] = useState(false);
  const [modalType, setModalType] = useState(null);
  const [recordPanelStudent, setRecordPanelStudent] = useState(null);
  const [isScoreBoardOpen, setIsScoreBoardOpen] = useState(false);
  const [isStatsPanelOpen, setIsStatsPanelOpen] = useState(false);
  const [isBehaviorManagerOpen, setIsBehaviorManagerOpen] = useState(false);
  const [inputText, setInputText] = useState('');
  const [isUploading, setIsUploading] = useState(false);

  const sortedStudents = useMemo(() => sortStudents(activeCourse.students), [activeCourse.students]);
  const stats = useMemo(
    () => getPeriodStats(activeCourse.students, activeCourse.records, currentDate, currentPeriod),
    [activeCourse.students, activeCourse.records, currentDate, currentPeriod]
  );

  const handleQuickToggle = (studentId) => quickToggleStudent(studentId, currentDate, currentPeriod);

  const handleModalSubmit = () => {
    if (modalType !== 'CLOUD_SETUP' && !inputText.trim()) return;
    if (modalType === 'IMPORT') {
      importStudents(inputText);
      showToast('已匯入學生');
    } else if (modalType === 'COURSE') {
      addNewCourse(inputText.split(/\n/).map((l) => l.trim()).filter((l) => l));
      showToast('已新增課程');
    } else if (modalType === 'PERIOD') {
      setPeriodConfig(inputText.split(/\n/).map((l) => l.trim()).filter((l) => l));
      showToast('節次已更新');
    } else if (modalType === 'CLOUD_SETUP') {
      setScriptUrl(inputText.trim());
      showToast('連結已儲存');
    }
    setModalType(null);
    setInputText('');
  };

  const handleBackupReport = async () => {
    if (!scriptUrl) { setModalType('CLOUD_SETUP'); return; }
    if (!window.confirm(`確定備份「${activeCourse.name} ${currentDate}」報表至雲端？`)) return;
    setIsUploading(true);
    try {
      await backupReport(scriptUrl, activeCourse, currentDate, currentPeriod);
      showToast('☁️ 報表已備份 (請查看試算表)');
    } catch (e) { showToast('❌ 備份失敗'); }
    finally { setIsUploading(false); }
  };

  const handleCopyReport = () => {
    const report = generateReport(activeCourse, currentDate, currentPeriod);
    copyToClipboard(report);
    showToast('報表已複製 (隱私保護)');
  };

  return (
    <div className="flex h-screen bg-gray-50 text-gray-800 font-sans overflow-hidden">
      {/* Desktop Sidebar */}
      <aside className="hidden md:flex flex-col w-72 bg-white border-r shadow-sm z-30">
        <Sidebar
          courses={courses} activeCourseId={activeCourseId} setActiveCourseId={setActiveCourseId}
          periodConfig={periodConfig} scriptUrl={scriptUrl} setScriptUrl={setScriptUrl}
          setPeriodConfig={setPeriodConfig} addNewCourse={addNewCourse} deleteCourse={deleteCourse}
          setModalType={setModalType} setInputText={setInputText} setIsSidebarOpen={setIsSidebarOpen}
          setCourses={setCourses} showToast={showToast}
          onOpenScoreBoard={() => setIsScoreBoardOpen(true)}
          onOpenStatsPanel={() => setIsStatsPanelOpen(true)}
        />
      </aside>

      {/* Main Area */}
      <div className="flex-1 flex flex-col h-full overflow-hidden relative">
        <Header
          activeCourseName={activeCourse.name}
          currentDate={currentDate} setCurrentDate={setCurrentDate}
          currentPeriod={currentPeriod} setCurrentPeriod={setCurrentPeriod}
          periodConfig={periodConfig} stats={stats}
          setIsSidebarOpen={setIsSidebarOpen}
        />

        {/* Mobile Sidebar Drawer */}
        {isSidebarOpen && (
          <div className="fixed inset-0 z-50 flex md:hidden">
            <div className="bg-white w-72 shadow-2xl flex flex-col h-full animate-slide-in">
              <Sidebar
                courses={courses} activeCourseId={activeCourseId} setActiveCourseId={setActiveCourseId}
                periodConfig={periodConfig} scriptUrl={scriptUrl} setScriptUrl={setScriptUrl}
                setPeriodConfig={setPeriodConfig} addNewCourse={addNewCourse} deleteCourse={deleteCourse}
                setModalType={setModalType} setInputText={setInputText} setIsSidebarOpen={setIsSidebarOpen}
                setCourses={setCourses} showToast={showToast}
                onOpenScoreBoard={() => setIsScoreBoardOpen(true)}
                onOpenStatsPanel={() => setIsStatsPanelOpen(true)}
              />
            </div>
            <div className="flex-1 bg-black bg-opacity-30 backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>
          </div>
        )}

        {/* Student List */}
        <main className="flex-1 overflow-y-auto p-3 lg:p-6 pb-24 bg-gray-50">
          {sortedStudents.length === 0 ? (
            <div className="h-full flex flex-col items-center justify-center text-gray-400 space-y-4">
              <Icons.LayoutGrid size={48} className="mx-auto mb-2 text-gray-300"/>
              <p>尚無學生資料</p>
              <button onClick={() => setModalType('IMPORT')} className="px-6 py-2 bg-indigo-600 text-white rounded-full shadow-lg">匯入名單</button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              {sortedStudents.map((s) => {
                const record = getFullRecord(activeCourse, currentDate, currentPeriod, s.id);
                return (
                  <StudentCard
                    key={s.id}
                    behaviors={behaviors}
                    student={s}
                    record={record}
                    onClick={() => handleQuickToggle(s.id)}
                    onOpenRecord={() => setRecordPanelStudent(s)}
                  />
                );
              })}
            </div>
          )}
        </main>

        {/* Action Buttons */}
        <div className="fixed bottom-6 right-6 z-10 flex gap-3">
          <button disabled={isUploading} onClick={handleBackupReport}
            className={`flex items-center gap-2 px-4 py-3 rounded-full shadow-xl font-bold text-white ${isUploading ? 'bg-gray-400' : 'bg-green-600 hover:bg-green-700'}`}>
            {isUploading ? <span className="spinner"></span> : <Icons.CloudUpload size={18}/>}
            <span className="hidden sm:inline">{isUploading ? '上傳中...' : '備份報表'}</span>
          </button>
          <button onClick={handleCopyReport}
            className="flex items-center gap-2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-xl hover:bg-slate-700 font-bold">
            <Icons.ShieldCheck size={18} className="text-green-300"/>
            <span className="hidden sm:inline">複製報表</span>
            <span className="sm:hidden">複製</span>
          </button>
        </div>
      </div>

      {/* Record Panel */}
      {recordPanelStudent && (
        <RecordPanel
          behaviors={behaviors}
          student={recordPanelStudent}
          record={getFullRecord(activeCourse, currentDate, currentPeriod, recordPanelStudent.id)}
          onSetStatus={(statusId) => {
            setStudentStatus(recordPanelStudent.id, statusId, currentDate, currentPeriod);
          }}
          onToggleBehavior={(behaviorId) => {
            toggleStudentBehavior(recordPanelStudent.id, currentDate, currentPeriod, behaviorId);
          }}
          onSetHomework={(status) => {
            setStudentHomework(recordPanelStudent.id, currentDate, currentPeriod, status);
          }}
          onSetNote={(note) => {
            setStudentNoteText(recordPanelStudent.id, currentDate, currentPeriod, note);
          }}
          onOpenBehaviorManager={() => setIsBehaviorManagerOpen(true)}
          onDelete={() => {
            deleteStudent(recordPanelStudent.id);
            showToast('已移除學生');
          }}
          onClose={() => setRecordPanelStudent(null)}
        />
      )}

      {/* Action Modals */}
      <ActionModals
        modalType={modalType}
        inputText={inputText}
        setInputText={setInputText}
        onSubmit={handleModalSubmit}
        onClose={() => { setModalType(null); setInputText(''); }}
      />

      {/* Score Board */}
      {isScoreBoardOpen && (
        <ScoreBoard behaviors={behaviors} course={activeCourse} onClose={() => setIsScoreBoardOpen(false)}/>
      )}

      {/* Stats Panel */}
      {isStatsPanelOpen && (
        <StatsPanel behaviors={behaviors} course={activeCourse} onClose={() => setIsStatsPanelOpen(false)}/>
      )}

      {/* Behavior Manager */}
      {isBehaviorManagerOpen && (
        <BehaviorManager
          behaviors={behaviors}
          customBehaviors={customBehaviors}
          addCustomBehavior={addCustomBehavior}
          updateCustomBehavior={updateCustomBehavior}
          deleteCustomBehavior={deleteCustomBehavior}
          hideDefaultBehavior={hideDefaultBehavior}
          onClose={() => setIsBehaviorManagerOpen(false)}
        />
      )}

      {/* Notification */}
      <Notification message={notification}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
